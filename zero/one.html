<div id="zero" class="space"></div>
<div id="one" class="space"></div>
<div id="two" class="space"></div>

<script>
	class Universe {
		#plane;
		#previous = null;
		#rendering = null;

		constructor() {
			this.el = document.getElementById('universe');
			this.#plane = this.el.getBoundingClientRect();
			new ResizeObserver(() => {
				this.#plane = this.el.getBoundingClientRect();
			}).observe(this.el);
			this.spaces = ['zero', 'one', 'two'].map((id) => ({
				el: document.getElementById(id),
				frame: 0,
				states: [],
			}));
			this.layouts = [
				{ spaces: null, variants: [0] },
				{ spaces: this.spaces.slice(0, 2), variants: [0, 1] },
				{ spaces: this.spaces.slice(), variants: [0, 1, 2, 3] },
			];
			// this.input = new Input(this);
		}

		get #state() {
			const { layout, variant, focused } = this.el.dataset;
			return [layout, variant, focused].map(Number);
		}
		get space() {
			return this.#rendering ?? this.spaces[this.#state[2]];
		}
		get visible() {
			const [layout, , focused] = this.#state;
			if (!layout) return [this.spaces[focused]];
			if (layout === 1 && focused === 2)
				return [this.spaces[0], this.spaces[2]];
			return this.layouts[layout].spaces;
		}
		get frame() {
			return this.space.el.querySelector(':scope > div');
		}

		coordinate({ clientX, clientY }) {
			const { left, top, width, height } = this.#plane;
			return {
				x: (2 * (clientX - left)) / (width || 1) - 1,
				y: 1 - (2 * (clientY - top)) / (height || 1),
			};
		}

		state() {
			const space = this.space;
			return (space.states[space.frame] ??= new Map());
		}

		sync(space) {
			try {
				for (const current of space ? [space] : this.visible) {
					this.#rendering = current;
					// this.input.clear(current);
					pathless.exec(current.el, pathless.frames[current.frame]);
				}
			} finally {
				this.#rendering = null;
			}
		}

		frames(frame, space = this.space) {
			if (frame === undefined) return [space.frame, pathless.frames];
			space.frame = frame;
			this.sync(space);
			return frame;
		}

		view(layout, variant = 0) {
			if (layout === undefined) {
				const [layout, variant] = this.#state;
				return [layout, variant, this.layouts];
			}
			const [currentLayout, currentVariant] = this.#state;
			if (layout > 0) this.#previous = [layout, variant];
			else if (currentLayout > 0)
				this.#previous = [currentLayout, currentVariant];
			this.el.dataset.layout = layout;
			this.el.dataset.variant = variant;
			this.sync();
			return [layout, variant];
		}

		focus(space) {
			const current = this.space;
			if (space === undefined) return [current, this.visible];
			if (space === current) {
				const [layout] = this.#state;
				if (layout > 0) return this.view(0);
				if (this.#previous) return this.view(...this.#previous);
			}
			this.el.dataset.focused = this.spaces.indexOf(space);
			return space;
		}
	}
</script>
