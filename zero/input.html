<script>
	class Input {
		constructor(universe) {
			this.universe = universe;
			this.keyboard = new Keyboard(universe);
			this.pointer = new Pointer(universe);
		}

		get tap() {
			return this.pointer.tap;
		}
		get swipe() {
			return this.pointer.swipe;
		}
		get scale() {
			return this.pointer.scale;
		}

		bind(key, fn) {
			return this.keyboard.bind(key, fn);
		}
		x(left, right) {
			return this.keyboard.x(left, right);
		}
		y(up, down) {
			return this.keyboard.y(up, down);
		}

		// Only keyboard bindings are per-space; pointer gestures are instance-global.
		clear(space) {
			this.keyboard.clear(space);
		}
	}
</script>
