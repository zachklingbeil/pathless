<script>
	class Pointer {
		#active = new Map();
		#blocked = false;
		#handlers = {};
		#separation;

		constructor(universe) {
			this.universe = universe;
			this.threshold = 0.25;
			const handle = (event) => {
				const point = this.universe.coordinate(event);
				if (event.type === 'pointerdown') this.#start(event, point);
				else if (event.type === 'pointermove') this.#move(event, point);
				else this.#end(event, event.type === 'pointercancel', point);
			};
			for (const type of [
				'pointerdown',
				'pointermove',
				'pointerup',
				'pointercancel',
			])
				universe.el.addEventListener(type, handle);
		}

		get active() {
			return [...this.#active.values()];
		}

		#distance([{ current: a }, { current: b }]) {
			return { x: Math.abs(b.x - a.x), y: Math.abs(b.y - a.y) };
		}

		get tap() {
			return this.#axes('tap');
		}

		get swipe() {
			return this.#axes('swipe');
		}

		get scale() {
			return this.#axes('scale');
		}

		#axes(type) {
			return {
				x: (negative, positive) =>
					this.#bind(type, 'x', negative, positive),
				y: (negative, positive) =>
					this.#bind(type, 'y', negative, positive),
			};
		}

		#bind(type, axis, negative, positive) {
			(this.#handlers[type] ??= {})[axis] = [negative, positive];
			return this;
		}

		#start(event, point) {
			if (
				this.#blocked ||
				this.#active.has(event.pointerId) ||
				this.#active.size === 2
			)
				return;
			const pointer = {
				space: event.target.closest?.('.space'),
				start: point,
				current: point,
			};
			this.#active.set(event.pointerId, pointer);
			this.universe.el.setPointerCapture(event.pointerId);
			if (this.#active.size === 2)
				this.#separation = this.#distance(this.active);
		}

		#move(event, point) {
			const pointer = this.#active.get(event.pointerId);
			if (!pointer) return;
			pointer.current = point;
			if (!this.#separation) return;

			const pointers = this.active;
			const current = this.#distance(pointers);
			const delta = {
				x: current.x - this.#separation.x,
				y: current.y - this.#separation.y,
			};
			const axis = Math.abs(delta.x) >= Math.abs(delta.y) ? 'x' : 'y';
			const steps = Math.trunc(delta[axis] / this.threshold);
			const handler = this.#handlers.scale?.[axis]?.[steps < 0 ? 0 : 1];
			for (let count = Math.abs(steps); count; count--)
				handler?.(pointers, event);
			this.#separation[axis] += steps * this.threshold;
		}

		#end(event, cancelled, point) {
			const pointer = this.#active.get(event.pointerId);
			if (!pointer) return;
			if (!cancelled) this.#move(event, point);

			try {
				if (!cancelled && !this.#blocked && !this.#separation) {
					const dx = pointer.current.x - pointer.start.x;
					const dy = pointer.current.y - pointer.start.y;
					const tap = Math.hypot(dx, dy) < this.threshold;
					const point = tap ? pointer.current : { x: dx, y: dy };
					const axis =
						Math.abs(point.x) >= Math.abs(point.y) ? 'x' : 'y';
					const positive = (Math.sign(point[axis]) || 1) >= 0;
					this.#handlers[tap ? 'tap' : 'swipe']?.[axis]?.[
						positive ? 1 : 0
					]?.(pointer, event);
				}
			} finally {
				this.#active.delete(event.pointerId);
				this.#separation = undefined;
				this.#blocked = this.#active.size > 0;
			}
		}
	}
</script>
