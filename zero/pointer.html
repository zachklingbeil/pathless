<script>
	class Pointer {
		#active = new Map();
		#blocked = false;
		#discrete;
		#continuous;
		#continue;
		#complete;

		constructor(universe) {
			this.universe = universe;
			const lifecycle = (set) => {
				const register = (count) => (fn) => {
					set(this.#pointers(count, fn));
					return this;
				};
				return { one: register(1), two: register(2) };
			};
			this.discrete = lifecycle((fn) => (this.#discrete = fn));
			this.continuous = lifecycle((fn) => (this.#continuous = fn));
			for (const type of [
				'pointerdown',
				'pointermove',
				'pointerup',
				'pointercancel',
			])
				universe.el.addEventListener(type, this);
		}

		get active() {
			return [...this.#active.values()];
		}

		#pointers(count, fn) {
			const adapt = (handler) => (pointer, event) => {
				if (this.#active.size !== count) return;
				const next = handler(
					count === 1 ? pointer : this.active,
					event,
				);
				return typeof next === 'function' ? adapt(next) : next;
			};
			return adapt(fn);
		}

		handleEvent(event) {
			const type = event.type.slice(7);
			if (type === 'down') this.#start(event);
			else if (type === 'move') this.#move(event);
			else this.#end(event, type === 'cancel');
		}

		#start(event) {
			if (
				this.#blocked ||
				this.#continue ||
				this.#active.has(event.pointerId) ||
				this.#active.size === 2
			)
				return;
			const pointer = {
				id: event.pointerId,
				space: event.target.closest?.('.space'),
				points: [this.universe.coordinate(event)],
			};
			this.#active.set(pointer.id, pointer);
			this.universe.el.setPointerCapture(pointer.id);

			this.#complete = undefined;
			const continuation = this.#continuous?.(pointer, event);
			if (typeof continuation === 'function')
				this.#continue = continuation;
			else this.#complete = this.#discrete?.(pointer, event);
		}

		#move(event) {
			if (!this.#continue) return;
			const pointer = this.#update(event);
			if (!pointer) return;
			this.#complete = this.#continue(pointer, event);
		}

		#end(event, cancelled) {
			const pointer = cancelled
				? this.#active.get(event.pointerId)
				: this.#update(event);
			if (!pointer) return;

			try {
				if (!cancelled && !this.#blocked)
					this.#complete?.(pointer, event);
			} finally {
				this.#active.delete(pointer.id);
				this.#continue = undefined;
				this.#complete = undefined;
				this.#blocked = this.#active.size > 0;
			}
		}

		#update(event) {
			const pointer = this.#active.get(event.pointerId);
			if (pointer) pointer.points.push(this.universe.coordinate(event));
			return pointer;
		}
	}
</script>
